# The host, served as static files. Portals are built and deployed apart and are
# loaded from their own origins, so the host's federation entry must be readable
# from them and never stale.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # The federation entry. A portal fetches it to find the host's client, session
  # and shared React, so it is never cached, and it carries CORS for the portals'
  # origins. add_header is not inherited into a location that sets its own.
  location = /assets/remoteEntry.js {
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Hashed build files never change under the same name. A portal imports the
  # host's chunks from another origin, so they carry CORS too.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # index.html names the current hashed files, so it is always revalidated. The
  # single-page fallback below also lands here.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Resolve lazily so unavailable portal dependencies do not stop nginx.
  resolver 127.0.0.11 valid=10s;
  # Same-origin delivery preserves Retry-After visibility in the browser.
  location /api/ {
    set $gateway http://synkro-api-gateway:8000;
    proxy_pass $gateway;
  }
  location /remotes/auth/ {
    set $auth_portal http://synkro-auth-portal:80;
    # A warm resolver cache can point at a stopped container. Bound both
    # resolution and the TCP handshake below the 15-second delivery contract.
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 504 =502 @auth_unavailable;
    rewrite ^/remotes/auth/(.*)$ /$1 break;
    proxy_pass $auth_portal;
    add_header Cache-Control "no-store" always;
  }
  location @auth_unavailable {
    add_header Cache-Control "no-store" always;
    return 502;
  }
  location /remotes/customers/ {
    set $customers_portal http://synkro-customers-portal:80;
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 502 504 =502 @customers_unavailable;
    rewrite ^/remotes/customers/(.*)$ /$1 break;
    proxy_pass $customers_portal;
  }
  location @customers_unavailable {
    add_header Cache-Control "no-store" always;
    return 502;
  }
  location /remotes/sales/ {
    set $sales_portal http://synkro-sales-portal:80;
    # A warm resolver cache can point at a stopped container. Bound both
    # resolution and the TCP handshake below the 15-second delivery contract.
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 504 =502 @sales_unavailable;
    rewrite ^/remotes/sales/(.*)$ /$1 break;
    proxy_pass $sales_portal;
    add_header Cache-Control "no-store" always;
  }
  location @sales_unavailable {
    add_header Cache-Control "no-store" always;
    return 502;
  }
  location /remotes/products/ {
    set $products_portal http://synkro-products-portal:80;
    # A warm resolver cache can point at a stopped container. Bound both
    # resolution and the TCP handshake below the 15-second delivery contract.
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 504 =502 @products_unavailable;
    rewrite ^/remotes/products/(.*)$ /$1 break;
    proxy_pass $products_portal;
    add_header Cache-Control "no-store" always;
  }
  location @products_unavailable {
    add_header Cache-Control "no-store" always;
    return 502;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
